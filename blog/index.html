<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog | Dolce-Rhea</title>

  <link rel="stylesheet" href="/blog/css/blog.css">

  <link rel="icon" type="image/jpeg" href="/images/favicon.ico">
</head>

<body>

<div class="blog-container">

  <a href="/#links" class="back-link">
    ← Links
  </a>

  <div class="blogpage-label">
    BLOG
    <span class="blogpage-sub">
      記事一覧
    </span>
  </div>

  <div class="blog-controls">

    <select id="sortSelect">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="title">名前順</option>
    </select>

    <div id="tagFilters" class="tag-filters"></div>

  </div>

  <main id="postsList" class="posts-list"></main>

</div>

<script src="/blog/js/blog.js"></script>

</body>
</html>
