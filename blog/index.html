<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog | Dolce-Rhea</title>

  <link rel="stylesheet" href="/blog/css/blog.css">

  <link rel="icon" type="image/jpeg" href="/images/favicon.ico">

  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"Blog",
      "name":"Dolce-Rhea Blog",
      "url":"https://dolce-rhea.live/blog/",
      "description":"Dolce-Rheaのブログ記事一覧。ランチア テーマやアルファロメオ156 GTAを中心としたカーライフ・整備記録。",
      "inLanguage":"ja",
      "publisher":{
        "@type":"Person",
        "name":"Dolce",
        "url":"https://dolce-rhea.live/"
      }
    }
  </script>

  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"BreadcrumbList",
      "itemListElement":[
        {
          "@type":"ListItem",
          "position":1,
          "name":"Dolce-Rhea",
          "item":"https://dolce-rhea.live/"
        },
        {
          "@type":"ListItem",
          "position":2,
          "name":"Blog",
          "item":"https://dolce-rhea.live/blog/"
        }
      ]
    }
  </script>
  
  <script>
  (() => {
    const last = Number(sessionStorage.getItem("blogLoaderShown") || 0);

    if (Date.now() - last < 24 * 60 * 60 * 1000) {
      document.documentElement.classList.add("skip-loader");
    }
  })();
  </script>
</head>

<body>

  <div id="loadingScreen">
    <div class="loader-logo">
      Dolce-Rhea
    </div>
  </div>

  <div class="blog-container">

    <a href="/#links" class="back-link">
      ← Links
    </a>

    <div class="blogpage-label">
      BLOG
      <span class="blogpage-sub">
        記事一覧
      </span>
    </div>

    <div class="blog-controls">

      <select id="sortSelect">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">名前順</option>
      </select>

      <div id="tagFilters" class="tag-filters"></div>

    </div>

    <main id="postsList" class="posts-list"></main>

  </div>

  <script src="/blog/js/blog.js"></script>

</body>
</html>
