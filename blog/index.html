<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- OGP -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog | Dolce-Rhea">
  <meta property="og:description" content="愛しのクルマたちのほか、Dolceの様々を綴るだけのブログ。">
  <meta property="og:url" content="https://dolce-rhea.live/blog/">
  <meta property="og:site_name" content="Dolce-Rhea">
  <meta property="og:image" content="https://dolce-rhea.live/images/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog | Dolce-Rhea">
  <meta name="twitter:description" content="愛しのクルマたちのほか、Dolceの様々を綴るだけのブログ。">
  <meta name="twitter:image" content="https://dolce-rhea.live/images/ogp.jpg">

  <link rel="stylesheet" href="/blog/css/blog.css">

  <link rel="icon" type="image/jpeg" href="/images/favicon.ico">

  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"Blog",
      "name":"Dolce-Rhea Blog",
      "url":"https://dolce-rhea.live/blog/",
      "description":"Dolce-Rheaのブログ記事一覧。愛しのクルマたちのほか、Dolceの様々を綴るだけのブログ。",
      "inLanguage":"ja",
      "publisher":{
        "@type":"Person",
        "name":"Dolce",
        "url":"https://dolce-rhea.live/"
      }
    }
  </script>

  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"BreadcrumbList",
      "itemListElement":[
        {
          "@type":"ListItem",
          "position":1,
          "name":"Dolce-Rhea",
          "item":"https://dolce-rhea.live/"
        },
        {
          "@type":"ListItem",
          "position":2,
          "name":"Blog",
          "item":"https://dolce-rhea.live/blog/"
        }
      ]
    }
  </script>

  <script>
    if (
      Date.now() - (Number(localStorage.getItem("blogLoaderShown")) || 0)
      < 24 * 60 * 60 * 1000
    ) {
      document.documentElement.classList.add("skip-loader");
    }
  </script>
</head>

<body>

  <div id="loader">
    <div class="loader-content">

      <h1>Dolce-Rhea</h1>

      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>

    </div>
  </div>

  <div class="blog-container">

    <a href="/#links" class="back-link">
      ← Links
    </a>

    <div class="blogpage-label">
      BLOG
      <span class="blogpage-sub">
        記事一覧
      </span>
    </div>

    <div class="blog-controls">

      <select id="sortSelect">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">名前順</option>
      </select>

      <div id="tagFilters" class="tag-filters"></div>

    </div>

    <main id="postsList" class="posts-list"></main>

  </div>

  <script src="/blog/js/blog.js"></script>

</body>

</html>
