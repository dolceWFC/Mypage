            </div>

        <article id="article" class="article"></article>

    </div>

    <script>

    const DAY = 24 * 60 * 60 * 1000;
    const MIN_LOADING = 700;

    const loaderKey =
    `articleLoaderShown:${location.pathname}`;

    async function waitArticleImages() {

    const images = [
        ...document.querySelectorAll(".article img")
    ];

    await Promise.all(

        images.map(img => {

        if (img.complete) {
            return Promise.resolve();
        }

        return new Promise(resolve => {

            img.onload = resolve;
            img.onerror = resolve;

        });

        })

    );

    }

    async function loadArticle() {

    const lastVisit =
        Number(localStorage.getItem(loaderKey)) || 0;

    const shouldShow =
        Date.now() - lastVisit > DAY;

    const md = await fetch("./post.md")
        .then(res => res.text());

    document.getElementById("article").innerHTML =
        marked.parse(md);

    if (!shouldShow) {

        document.body.classList.add("skip-loader");
        document.body.classList.add("loaded");
        return;

    }

    await Promise.all([

        waitArticleImages(),

        new Promise(resolve =>
        setTimeout(resolve, MIN_LOADING)
        )

    ]);

    localStorage.setItem(
        loaderKey,
        Date.now()
    );

    document.body.classList.add("loaded");

    }

    loadArticle();

    </script>
