    <div id="loader">

            </div>
        </header>

        <article id="article" class="article"></article>

    </div>

    <script>

    const DAY = 24 * 60 * 60 * 1000;
    const MIN_LOADING = 700;

    async function waitArticleImages() {

        const images = [
            ...document.querySelectorAll("#article img")
        ];

        await Promise.all(

            images.map(img => {

                if (img.complete)
                    return Promise.resolve();

                return new Promise(resolve => {

                    img.onload = resolve;
                    img.onerror = resolve;

                });

            })

        );

    }

    async function loadArticle() {

        const shouldShow =
            Date.now() -
                (Number(localStorage.getItem(ARTICLE_KEY)) || 0)
            > DAY;

        // markdown取得
        const md = await fetch("./post.md")
            .then(res => res.text());

        // HTML生成
        document.getElementById("article").innerHTML =
            marked.parse(md);

        if (!shouldShow) {

            document.body.classList.add("skip-loader");
            document.body.classList.add("loaded");
            return;

        }

        // 画像読込＋最低表示時間
        await Promise.all([

            waitArticleImages(),

            new Promise(resolve =>
                setTimeout(resolve, MIN_LOADING)
            )

        ]);

        localStorage.setItem(
            ARTICLE_KEY,
            Date.now()
        );

        document.body.classList.add("loaded");

    }

    window.addEventListener("load", loadArticle);

    </script>
