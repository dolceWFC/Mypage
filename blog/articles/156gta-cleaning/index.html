    <script>

    const DAY = 24 * 60 * 60 * 1000;
    const MIN_LOADING = 700;

    async function loadArticle() {

        const lastVisit =
            Number(localStorage.getItem("articleLoaderShown")) || 0;

        const shouldShow =
            Date.now() - lastVisit > DAY;

        const markdownPromise =
            fetch("./post.md")
                .then(res => res.text());

        if (!shouldShow) {

            document.body.classList.add("skip-loader");

            const md = await markdownPromise;

            document.getElementById("article").innerHTML =
                marked.parse(md);

            document.body.classList.add("loaded");

            return;
        }

        const [md] = await Promise.all([

            markdownPromise,

            new Promise(resolve =>
                setTimeout(resolve, MIN_LOADING)
            )

        ]);

        document.getElementById("article").innerHTML =
            marked.parse(md);

        localStorage.setItem(
            "articleLoaderShown",
            Date.now()
        );

        document.body.classList.add("loaded");

    }

    loadArticle();

    </script>
