<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{plainTitle}} | Dolce-Rhea</title>

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{plainTitle}}">
    <meta property="og:description" content="{{summary}}">
    <meta property="og:url" content="https://dolce-rhea.live/blog/articles/{{slug}}/">
    <meta property="og:image" content="https://dolce-rhea.live{{cover}}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{plainTitle}}">
    <meta name="twitter:description" content="{{summary}}">
    <meta name="twitter:image" content="https://dolce-rhea.live{{cover}}">

    <link rel="canonical" href="https://dolce-rhea.live/blog/articles/{{slug}}/">

    <link rel="stylesheet" href="/blog/css/blog.css">

    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="blog-container">

        <header class="blog-header">
            <a href="/blog/" class="back-link">← Blog</a>

            <div class="post-hero">
                <p class="post-date">{{date}}</p>
                <h1 class="post-title">{{title}}</h1>
            </div>
        </header>

        <article id="article" class="article"></article>

    </div>

    <script>
        fetch("./post.md")
            .then(res => res.text())
            .then(md => {
                document.getElementById("article").innerHTML =
                    marked.parse(md);
            });
    </script>

</body>

</html>
