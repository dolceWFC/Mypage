<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{plainTitle}} | Dolce-Rhea</title>

    <meta name="description" content="{{summary}}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{plainTitle}}">
    <meta property="og:description" content="{{summary}}">
    <meta property="og:url" content="https://dolce-rhea.live/blog/articles/{{slug}}/">
    <meta property="og:image" content="https://dolce-rhea.live{{cover}}">
    <meta property="article:published_time" content="{{date}}T00:00:00+09:00">
    <meta property="article:modified_time" content="{{date}}T00:00:00+09:00">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{plainTitle}}">
    <meta name="twitter:description" content="{{summary}}">
    <meta name="twitter:image" content="https://dolce-rhea.live{{cover}}">

        <!-- Structured Data -->
    <script type="application/ld+json">
        {
            "@context":"https://schema.org",
            "@type":"BlogPosting",

            "headline":"{{plainTitle}}",

            "description":"{{summary}}",

            "image":"https://dolce-rhea.live{{cover}}",

            "url":"https://dolce-rhea.live/blog/articles/{{slug}}/",

            "mainEntityOfPage":{
                "@type":"WebPage",
                "@id":"https://dolce-rhea.live/blog/articles/{{slug}}/"
            },

            "datePublished":"{{date}}T00:00:00+09:00",

            "dateModified":"{{date}}T00:00:00+09:00",

            "inLanguage":"ja",

            "author":{
                "@type":"Person",
                "name":"Dolce",
                "url":"https://dolce-rhea.live/"
            },

            "publisher":{
                "@type":"Person",
                "name":"Dolce",
                "url":"https://dolce-rhea.live/"
            }
        }
    </script>

    <script type="application/ld+json">
    {
        "@context":"https://schema.org",
        "@type":"BreadcrumbList",
        "itemListElement":[
            {
            "@type":"ListItem",
            "position":1,
            "name":"Dolce-Rhea",
            "item":"https://dolce-rhea.live/"
            },
            {
            "@type":"ListItem",
            "position":2,
            "name":"Blog",
            "item":"https://dolce-rhea.live/blog/"
            },
            {
            "@type":"ListItem",
            "position":3,
            "name":"{{plainTitle}}",
            "item":"https://dolce-rhea.live/blog/articles/{{slug}}/"
            }
        ]
    }
    </script>

    <link rel="canonical" href="https://dolce-rhea.live/blog/articles/{{slug}}/">

    <link rel="stylesheet" href="/blog/css/blog.css">

    <link rel="icon" href="/images/favicon.ico">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="blog-container">

        <header class="blog-header">
            <a href="/blog/" class="back-link">← Blog</a>

            <div class="post-hero">
                <p class="post-date">{{date}}</p>
                <h1 class="post-title">{{title}}</h1>
            </div>
        </header>

        <article id="article" class="article"></article>

    </div>

    <script>
        fetch("./post.md")
            .then(res => res.text())
            .then(md => {
                document.getElementById("article").innerHTML =
                    marked.parse(md);
            });
    </script>

</body>

</html>
